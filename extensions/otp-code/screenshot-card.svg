<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="A verification code card in the bottom-right corner of the mail window">
  <title>The code card, in the corner of the window</title>
  <defs>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .fg { fill: #020817; }
      .muted { fill: #64748b; }
      .primary { fill: #3b82f6; }
    </style>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="400" rx="10" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="639" height="399" rx="10" fill="none" stroke="#e2e8f0"/>

  <!-- Folder rail -->
  <rect x="1" y="1" width="150" height="398" fill="#f8fafc"/>
  <line x1="151" y1="1" x2="151" y2="399" stroke="#e2e8f0"/>
  <rect x="16" y="24" width="72" height="9" rx="4.5" fill="#cbd5e1"/>
  <rect x="12" y="52" width="127" height="28" rx="6" fill="#e2e8f0"/>
  <rect x="24" y="62" width="54" height="8" rx="4" fill="#94a3b8"/>
  <rect x="24" y="96" width="66" height="8" rx="4" fill="#cbd5e1"/>
  <rect x="24" y="126" width="46" height="8" rx="4" fill="#cbd5e1"/>
  <rect x="24" y="156" width="58" height="8" rx="4" fill="#cbd5e1"/>
  <rect x="24" y="186" width="40" height="8" rx="4" fill="#cbd5e1"/>

  <!-- Message list -->
  <g>
    <rect x="168" y="24" width="180" height="10" rx="5" fill="#cbd5e1"/>
    <g>
      <rect x="168" y="56" width="140" height="9" rx="4.5" fill="#94a3b8"/>
      <rect x="168" y="74" width="330" height="8" rx="4" fill="#e2e8f0"/>
      <line x1="168" y1="100" x2="616" y2="100" stroke="#f1f5f9"/>
    </g>
    <g>
      <rect x="168" y="116" width="120" height="9" rx="4.5" fill="#94a3b8"/>
      <rect x="168" y="134" width="300" height="8" rx="4" fill="#e2e8f0"/>
      <line x1="168" y1="160" x2="616" y2="160" stroke="#f1f5f9"/>
    </g>
    <g>
      <rect x="168" y="176" width="156" height="9" rx="4.5" fill="#94a3b8"/>
      <rect x="168" y="194" width="270" height="8" rx="4" fill="#e2e8f0"/>
      <line x1="168" y1="220" x2="616" y2="220" stroke="#f1f5f9"/>
    </g>
  </g>

  <!-- The card -->
  <g filter="url(#cardShadow)">
    <rect x="296" y="248" width="324" height="128" rx="9" fill="#ffffff" stroke="#e2e8f0"/>

    <!-- Extension glyph -->
    <rect x="310" y="262" width="28" height="28" rx="6" fill="#3b82f6" fill-opacity="0.1"/>
    <path d="M318.5 270.5h5.5v-1.5a2.5 2.5 0 1 1 5 0v1.5h1.5a1.5 1.5 0 0 1 1.5 1.5v1.5h-1.5a2.5 2.5 0 1 0 0 5h1.5v3a1.5 1.5 0 0 1-1.5 1.5h-3v-1.5a2.5 2.5 0 1 0-5 0v1.5h-3a1.5 1.5 0 0 1-1.5-1.5v-11z" fill="#3b82f6"/>

    <text class="ui fg" x="348" y="274" font-size="13" font-weight="600">Verification code</text>
    <text class="ui muted" x="606" y="274" font-size="11.5" text-anchor="end">4:58</text>
    <text class="ui muted" x="348" y="290" font-size="11.5">Sarv Security</text>

    <text class="ui muted" x="348" y="314" font-size="10.5">Code</text>
    <text class="mono fg" x="348" y="336" font-size="21" font-weight="600" letter-spacing="3">081678</text>

    <!-- Copy button -->
    <rect x="566" y="312" width="32" height="28" rx="6" fill="#f1f5f9"/>
    <rect x="575" y="320" width="10" height="12" rx="2" fill="none" stroke="#64748b" stroke-width="1.6"/>
    <path d="M579 318v-2a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-1" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round"/>

    <text class="ui primary" x="348" y="360" font-size="11.5">Open the message</text>
  </g>

  <text class="ui muted" x="296" y="238" font-size="11">Appears on its own the moment the code arrives</text>
</svg>
