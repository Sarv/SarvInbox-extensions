<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Copying the code marks the message read in the list behind it">
  <title>Copying the code marks the message read</title>
  <defs>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .fg { fill: #020817; }
      .muted { fill: #64748b; }
      .primary { fill: #3b82f6; }
    </style>
    <filter id="copyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="400" rx="10" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="639" height="399" rx="10" fill="none" stroke="#e2e8f0"/>

  <text class="ui muted" x="28" y="34" font-size="11">Before</text>
  <text class="ui muted" x="28" y="170" font-size="11">After you copy</text>

  <!-- Unread row -->
  <rect x="24" y="48" width="592" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <circle cx="44" cy="78" r="4" fill="#3b82f6"/>
  <text class="ui fg" x="62" y="72" font-size="13" font-weight="600">Sarv Security</text>
  <text class="ui fg" x="62" y="91" font-size="12" font-weight="600">Your verification code</text>
  <text class="ui muted" x="592" y="72" font-size="11" text-anchor="end">09:41</text>
  <text class="ui muted" x="592" y="91" font-size="10.5" text-anchor="end">unread</text>

  <!-- Read row -->
  <rect x="24" y="184" width="592" height="60" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="ui muted" x="62" y="208" font-size="13">Sarv Security</text>
  <text class="ui muted" x="62" y="227" font-size="12">Your verification code</text>
  <text class="ui muted" x="592" y="208" font-size="11" text-anchor="end">09:41</text>
  <text class="ui muted" x="592" y="227" font-size="10.5" text-anchor="end">read</text>

  <!-- The card doing it -->
  <g filter="url(#copyShadow)">
    <rect x="296" y="264" width="324" height="112" rx="9" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="310" y="278" width="28" height="28" rx="6" fill="#3b82f6" fill-opacity="0.1"/>
    <path d="M318.5 286.5h5.5v-1.5a2.5 2.5 0 1 1 5 0v1.5h1.5a1.5 1.5 0 0 1 1.5 1.5v1.5h-1.5a2.5 2.5 0 1 0 0 5h1.5v3a1.5 1.5 0 0 1-1.5 1.5h-3v-1.5a2.5 2.5 0 1 0-5 0v1.5h-3a1.5 1.5 0 0 1-1.5-1.5v-11z" fill="#3b82f6"/>
    <text class="ui fg" x="348" y="290" font-size="13" font-weight="600">Verification code</text>
    <text class="ui muted" x="606" y="290" font-size="11.5" text-anchor="end">4:12</text>
    <text class="ui muted" x="348" y="312" font-size="10.5">Code</text>
    <text class="mono fg" x="348" y="334" font-size="21" font-weight="600" letter-spacing="3">081678</text>

    <!-- Copy button, pressed -->
    <rect x="566" y="310" width="32" height="28" rx="6" fill="#3b82f6" fill-opacity="0.12"/>
    <path d="M573.5 324.5l4.5 4.5 8.5-9" fill="none" stroke="#3b82f6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="ui primary" x="348" y="360" font-size="11.5">Copied - the message is marked read</text>
  </g>

  <!-- Link the copy to the row it changed -->
  <path d="M120 250 C 120 292, 200 300, 292 306" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M126 246l-7 5 8 4" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
