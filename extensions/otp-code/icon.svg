<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="One-Time Passcodes">
  <title>One-Time Passcodes</title>
  <!-- A standalone logo: drawn in <img>, where `currentColor` has nothing to
       inherit from, so every colour here is literal on purpose. The palette
       matches the app's primary/blue family so it sits right in the catalogue. -->
  <defs>
    <linearGradient id="otpBadge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#otpBadge)"/>
  <path d="M22 28v-5a10 10 0 0 1 20 0v5" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
  <rect x="15" y="28" width="34" height="23" rx="6" fill="#ffffff"/>
  <circle cx="24" cy="39.5" r="3" fill="#2563eb"/>
  <circle cx="32" cy="39.5" r="3" fill="#2563eb"/>
  <circle cx="40" cy="39.5" r="3" fill="#2563eb"/>
</svg>
