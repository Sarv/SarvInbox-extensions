<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="The Summarize Conversation button above a long thread">
  <title>Where you ask for a summary</title>
  <defs>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .fg { fill: #020817; }
      .muted { fill: #64748b; }
    </style>
  </defs>

  <rect width="640" height="400" rx="10" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="639" height="399" rx="10" fill="none" stroke="#e2e8f0"/>

  <text class="ui fg" x="40" y="56" font-size="18" font-weight="600">Rollout plan - final round</text>
  <text class="ui muted" x="40" y="76" font-size="11.5">9 messages, 5 people</text>

  <!-- The button, as it sits above the thread -->
  <rect x="38" y="96" width="214" height="32" rx="6" fill="#f1f5f9"/>
  <path d="M56 106l1.6 3.9 3.9 1.6-3.9 1.6-1.6 3.9-1.6-3.9-3.9-1.6 3.9-1.6z" fill="#a855f7"/>
  <path d="M64.5 114.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z" fill="#a855f7"/>
  <text class="ui muted" x="76" y="117" font-size="13">Summarize Conversation</text>

  <!-- The thread it would summarise -->
  <g>
    <rect x="40" y="152" width="560" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text class="ui fg" x="56" y="174" font-size="12" font-weight="600">Priya Menon</text>
    <rect x="56" y="184" width="430" height="8" rx="4" fill="#e2e8f0"/>

    <rect x="40" y="212" width="560" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text class="ui fg" x="56" y="234" font-size="12" font-weight="600">Daniel Okafor</text>
    <rect x="56" y="244" width="486" height="8" rx="4" fill="#e2e8f0"/>

    <rect x="40" y="272" width="560" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text class="ui fg" x="56" y="294" font-size="12" font-weight="600">Alex Reyes</text>
    <rect x="56" y="304" width="392" height="8" rx="4" fill="#e2e8f0"/>
  </g>

  <text class="ui muted" x="40" y="356" font-size="11">Only when you ask, unless you turn on summarising long mail as it arrives.</text>
</svg>
