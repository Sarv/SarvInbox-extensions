<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="The AI Summary panel open above a thread, with key points and participants">
  <title>The summary panel</title>
  <defs>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .fg { fill: #020817; }
      .muted { fill: #64748b; }
    </style>
  </defs>

  <rect width="640" height="400" rx="10" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="639" height="399" rx="10" fill="none" stroke="#e2e8f0"/>

  <text class="ui fg" x="40" y="48" font-size="16" font-weight="600">Rollout plan - final round</text>

  <!-- The panel -->
  <rect x="40" y="66" width="560" height="248" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>

  <path d="M62 84l1.8 4.4 4.4 1.8-4.4 1.8-1.8 4.4-1.8-4.4-4.4-1.8 4.4-1.8z" fill="#a855f7"/>
  <text class="ui fg" x="78" y="95" font-size="13" font-weight="600">AI Summary</text>
  <path d="M574 94l6-6 6 6" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <text class="ui fg" x="58" y="124" font-size="12">The team settled on shipping Thursday behind a flag, with the</text>
  <text class="ui fg" x="58" y="142" font-size="12">migration run the night before and a rollback documented first.</text>

  <text class="ui muted" x="58" y="174" font-size="10" font-weight="600" letter-spacing="1">KEY POINTS</text>

  <path d="M59 186l2.6 2.6 5-5.2" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="62.5" cy="186" r="6.5" fill="none" stroke="#22c55e" stroke-width="1.4"/>
  <text class="ui fg" x="78" y="190" font-size="12">Ship Thursday, behind a feature flag</text>

  <path d="M59 210l2.6 2.6 5-5.2" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="62.5" cy="210" r="6.5" fill="none" stroke="#22c55e" stroke-width="1.4"/>
  <text class="ui fg" x="78" y="214" font-size="12">Daniel to write the rollback note by Tuesday</text>

  <path d="M59 234l2.6 2.6 5-5.2" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="62.5" cy="234" r="6.5" fill="none" stroke="#22c55e" stroke-width="1.4"/>
  <text class="ui fg" x="78" y="238" font-size="12">Migration runs Wednesday 23:00, not during the day</text>

  <circle cx="62" cy="264.5" r="3.2" fill="none" stroke="#64748b" stroke-width="1.4"/>
  <path d="M56.5 272.5a5.5 5.5 0 0 1 11 0" fill="none" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/>
  <text class="ui muted" x="78" y="272" font-size="11">Priya Menon, Daniel Okafor, Alex Reyes</text>

  <path d="M67.5 297a5.5 5.5 0 1 1-1.7-4M67.5 289.5v4h-4" fill="none" stroke="#64748b" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="ui muted" x="72" y="300" font-size="11">Regenerate</text>

  <text class="ui muted" x="40" y="346" font-size="11">The panel sits above the thread, collapsed until you open it, and is kept so re-opening is instant.</text>
</svg>
