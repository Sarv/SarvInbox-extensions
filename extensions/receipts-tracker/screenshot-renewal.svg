<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="A card warning that a free trial converts to a paid subscription in three days">
  <title>The warning, three days before the charge</title>
  <defs>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .fg { fill: #0b1530; }
      .muted { fill: #6b7691; }
      .brand { fill: #3069b0; }
    </style>
    <filter id="noticeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="400" rx="10" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="639" height="399" rx="10" fill="none" stroke="#e2e8f0"/>

  <!-- Folder rail -->
  <rect x="1" y="1" width="150" height="398" fill="#f8fafc"/>
  <line x1="151" y1="1" x2="151" y2="399" stroke="#e2e8f0"/>
  <rect x="16" y="24" width="72" height="9" rx="4.5" fill="#cbd5e1"/>
  <rect x="12" y="52" width="127" height="28" rx="6" fill="#e2e8f0"/>
  <rect x="24" y="62" width="54" height="8" rx="4" fill="#94a3b8"/>
  <rect x="24" y="96" width="66" height="8" rx="4" fill="#cbd5e1"/>
  <rect x="24" y="126" width="46" height="8" rx="4" fill="#cbd5e1"/>
  <rect x="24" y="156" width="58" height="8" rx="4" fill="#cbd5e1"/>
  <rect x="24" y="186" width="40" height="8" rx="4" fill="#cbd5e1"/>

  <!-- Message list -->
  <rect x="168" y="24" width="180" height="10" rx="5" fill="#cbd5e1"/>
  <rect x="168" y="56" width="140" height="9" rx="4.5" fill="#94a3b8"/>
  <rect x="168" y="74" width="330" height="8" rx="4" fill="#e2e8f0"/>
  <line x1="168" y1="100" x2="616" y2="100" stroke="#f1f5f9"/>
  <rect x="168" y="116" width="120" height="9" rx="4.5" fill="#94a3b8"/>
  <rect x="168" y="134" width="300" height="8" rx="4" fill="#e2e8f0"/>
  <line x1="168" y1="160" x2="616" y2="160" stroke="#f1f5f9"/>
  <rect x="168" y="176" width="156" height="9" rx="4.5" fill="#94a3b8"/>
  <rect x="168" y="194" width="270" height="8" rx="4" fill="#e2e8f0"/>
  <line x1="168" y1="220" x2="616" y2="220" stroke="#f1f5f9"/>

  <!-- The card -->
  <g filter="url(#noticeShadow)">
    <rect x="296" y="248" width="324" height="128" rx="9" fill="#ffffff" stroke="#e2e8f0"/>

    <!-- Extension glyph -->
    <rect x="310" y="262" width="28" height="28" rx="6" fill="#10936a" fill-opacity="0.12"/>
    <path d="M318.5 269.5h11v14l-1.8-1.1-1.8 1.1-1.9-1.1-1.8 1.1-1.9-1.1-1.8 1.1z" fill="#0a6d4f"/>
    <path d="M321 273.5h6M321 277h6M321 280.5h3" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round"/>

    <text class="ui fg" x="348" y="274" font-size="13" font-weight="600">Trial ends in 3 days</text>
    <rect x="551" y="262" width="55" height="17" rx="8.5" fill="#fef6e0"/>
    <text class="ui" x="578.5" y="274" font-size="10" font-weight="600" fill="#8a6708" text-anchor="middle">Act now</text>
    <text class="ui muted" x="348" y="290" font-size="11.5">Receipts &amp; Subscriptions</text>

    <text class="ui fg" x="348" y="322" font-size="15" font-weight="600">Figma becomes &#8377;1,499 a month</text>
    <text class="ui muted" x="348" y="341" font-size="11.5">First charge Saturday 26 September</text>

    <text class="ui brand" x="348" y="363" font-size="11.5">Open the message</text>
  </g>

  <text class="ui muted" x="296" y="238" font-size="11">Once per charge, and never again for the same one</text>
</svg>
