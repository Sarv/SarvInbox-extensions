<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="The vip tag under the subject line in the reading pane">
  <title>The vip tag in the reading pane</title>
  <defs>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .fg { fill: #020817; }
      .muted { fill: #64748b; }
    </style>
  </defs>

  <rect width="640" height="400" rx="10" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="639" height="399" rx="10" fill="none" stroke="#e2e8f0"/>

  <text class="ui fg" x="40" y="60" font-size="18" font-weight="600">Re: contract wording for Thursday</text>

  <!-- Soft chip, the weight used under a subject -->
  <rect x="40" y="76" width="30" height="16" rx="4" fill="#f59e0b" fill-opacity="0.13"/>
  <text class="ui" x="55" y="88" font-size="10" font-weight="600" fill="#b45309" text-anchor="middle">vip</text>

  <circle cx="52" cy="128" r="16" fill="#f1f5f9"/>
  <text class="ui muted" x="52" y="133" font-size="13" font-weight="600" text-anchor="middle">PM</text>
  <text class="ui fg" x="80" y="124" font-size="13" font-weight="600">Priya Menon</text>
  <text class="ui muted" x="80" y="141" font-size="11.5">priya@example.com</text>
  <text class="ui muted" x="600" y="124" font-size="11" text-anchor="end">Today at 10:12</text>

  <line x1="40" y1="162" x2="600" y2="162" stroke="#e2e8f0"/>

  <rect x="40" y="184" width="430" height="9" rx="4.5" fill="#e2e8f0"/>
  <rect x="40" y="206" width="520" height="9" rx="4.5" fill="#e2e8f0"/>
  <rect x="40" y="228" width="474" height="9" rx="4.5" fill="#e2e8f0"/>
  <rect x="40" y="258" width="380" height="9" rx="4.5" fill="#e2e8f0"/>
  <rect x="40" y="280" width="290" height="9" rx="4.5" fill="#e2e8f0"/>

  <text class="ui muted" x="40" y="346" font-size="11">Because the tag is a real label, you can filter, search and set rules on it like any other.</text>
</svg>
