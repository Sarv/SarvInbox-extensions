name: Release extension

# Tag format is `<extension-id>-v<version>`, e.g. `otp-code-v1.2.0`. One tag
# namespace for the whole repository is what lets a single workflow serve every
# extension and lets the registry builder tell releases apart.
on:
  push:
    tags:
      - '*-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Resolve the extension from the tag
        id: target
        run: |
          tag="${GITHUB_REF_NAME}"
          id="${tag%-v*}"
          version="${tag##*-v}"
          if [ ! -d "extensions/$id" ]; then
            echo "No extensions/$id for tag $tag" >&2
            exit 1
          fi
          manifest_version=$(node -p "require('./extensions/$id/sarvinbox-extension.json').version")
          if [ "$manifest_version" != "$version" ]; then
            echo "Tag says $version but extensions/$id/sarvinbox-extension.json says $manifest_version" >&2
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile

      # The whole repository is verified, not just the tagged extension: they
      # share one SDK version, so a release is also a statement that the others
      # still build against it.
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/verify-bundle.mjs

      - name: Pack
        id: pack
        run: node scripts/pack-extension.mjs "${{ steps.target.outputs.id }}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "${{ steps.target.outputs.id }} ${{ steps.target.outputs.version }}" \
            --notes "SHA-256: \`${{ steps.pack.outputs.sha256 }}\`

          Install from the Extensions panel in Sarv Inbox, or download the archive below." \
            "${{ steps.pack.outputs.archive }}" \
            "${{ steps.pack.outputs.checksum_file }}"

      # A release the archive never reached is worth catching here rather than
      # one job later, so the upload is read back before the job passes.
      #
      # Read back through `/releases/<id>/assets`, never the `assets` array
      # embedded in a release object: that array has been seen empty on releases
      # whose assets are present and downloadable (2026-09-23, two of eight),
      # which would make this step fail a perfectly good release and then retry
      # an upload that is already there.
      - name: Verify the assets reached the release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.pack.outputs.archive }}
          CHECKSUM: ${{ steps.pack.outputs.checksum_file }}
        run: |
          archive="$(basename "$ARCHIVE")"
          checksum="$(basename "$CHECKSUM")"
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq '.id')"
          attempt=1
          while true; do
            # Only `uploaded` counts: a failed upload can leave the asset
            # listed in another state, which is present without being fetchable.
            uploaded="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
              --jq '[.[] | select(.state == "uploaded") | .name] | join(" ")')"
            missing=""
            for name in "$archive" "$checksum"; do
              case " $uploaded " in
                *" $name "*) ;;
                *) missing="$missing $name" ;;
              esac
            done
            if [ -z "$missing" ]; then
              echo "OK: $GITHUB_REF_NAME carries $archive and $checksum"
              exit 0
            fi
            if [ "$attempt" -ge 3 ]; then
              echo "Still missing from $GITHUB_REF_NAME after $attempt checks:$missing" >&2
              exit 1
            fi
            echo "Missing from $GITHUB_REF_NAME:$missing - re-uploading (attempt $attempt)" >&2
            gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" "$CHECKSUM" --clobber || true
            attempt=$((attempt + 1))
            sleep 5
          done

  registry:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # The builder unpacks each released archive to read the manifest that was
      # actually shipped, so it needs the repository's own dependencies, not
      # just a Node runtime. Without this the job dies on `Cannot find package
      # 'tar'` after the release has already been published, which leaves a real
      # release that the catalogue never learns about.
      - run: pnpm install --frozen-lockfile

      # Rebuilds the registry from the published releases and commits it back,
      # so the app sees the new version without anyone editing a file by hand.
      # The checksum is computed by downloading the asset that was just
      # published, not copied from the job above.
      #
      # Two artifacts: registry.json is the pretty, reviewable one; registry/ is
      # the minified index and detail documents the app actually fetches. Both
      # come from the same run, so they cannot drift apart.
      - name: Rebuild the registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/build-registry.mjs

      - name: Commit
        id: commit
        run: |
          # --porcelain rather than `git diff --quiet`, because registry/ is
          # rebuilt from scratch and a new extension shows up as an untracked
          # file that a diff against HEAD would not see at all.
          if [ -z "$(git status --porcelain -- registry.json registry/)" ]; then
            echo "registry unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry.json registry/
          git commit -m "chore(registry): publish ${GITHUB_REF_NAME}"
          git push origin main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # The app asks the CDN for these documents before it asks GitHub, and the
      # CDN caches a branch ref for 12 hours. Without this, a release published
      # today is correct on GitHub and invisible in the app until that cache
      # expires - which looks exactly like a release that never happened.
      - name: Purge the CDN mirror
        if: steps.commit.outputs.pushed == 'true'
        env:
          REPO: ${{ github.repository }}
        run: |
          for file in $(git ls-files registry); do
            curl -fsS "https://purge.jsdelivr.net/gh/$REPO@main/$file" -o /dev/null \
              || echo "WARN: could not purge $file" >&2
          done

      # A purge that did not take is the same silence as a release with no
      # assets: every job green, and the catalogue everyone reads still stale.
      # generatedAt makes this run's index unique, so a byte comparison proves
      # the CDN is serving THIS registry and not a convincing older one.
      - name: Verify the CDN serves the new registry
        if: steps.commit.outputs.pushed == 'true'
        env:
          REPO: ${{ github.repository }}
        run: |
          served="$(mktemp)"
          attempt=1
          while true; do
            if curl -fsS "https://cdn.jsdelivr.net/gh/$REPO@main/registry/index.json" -o "$served" \
              && cmp -s "$served" registry/index.json; then
              echo "OK: the CDN serves the registry published by $GITHUB_REF_NAME"
              exit 0
            fi
            if [ "$attempt" -ge 5 ]; then
              echo "The CDN still serves an older registry after $attempt checks" >&2
              exit 1
            fi
            echo "CDN not updated yet - purging again (attempt $attempt)" >&2
            curl -fsS "https://purge.jsdelivr.net/gh/$REPO@main/registry/index.json" -o /dev/null || true
            attempt=$((attempt + 1))
            sleep 10
          done
